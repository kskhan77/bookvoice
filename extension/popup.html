<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        width: 300px;
        margin: 0;
        padding: 14px;
        background: #1b1d22;
        color: #e8e8ea;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      label {
        font-size: 12px;
        color: #a5a8b0;
        min-width: 44px;
      }
      select,
      input[type="range"] {
        flex: 1;
      }
      select {
        background: #2a2d35;
        color: inherit;
        border: 1px solid #3a3e48;
        border-radius: 6px;
        padding: 5px 6px;
        font-size: 13px;
      }
      button {
        flex: 1;
        padding: 8px 6px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: #2a2d35;
        color: #e8e8ea;
      }
      button.primary {
        background: #4f7cff;
        color: #fff;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #speedVal {
        font-size: 12px;
        color: #a5a8b0;
        min-width: 34px;
        text-align: right;
      }
      #status {
        font-size: 12px;
        color: #a5a8b0;
        margin-top: 10px;
        min-height: 30px;
        line-height: 1.4;
      }
      #bar {
        height: 4px;
        background: #2a2d35;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 6px;
      }
      #fill {
        height: 100%;
        width: 0;
        background: #4f7cff;
        transition: width 0.3s;
      }
    </style>
  </head>
  <body>
    <h1>📖 BookVoice</h1>
    <div class="row">
      <label for="voice">Voice</label>
      <select id="voice">
        <option value="af_heart">Heart (US female) — best</option>
        <option value="af_bella">Bella (US female)</option>
        <option value="af_nicole">Nicole (US female, soft)</option>
        <option value="am_michael">Michael (US male)</option>
        <option value="am_fenrir">Fenrir (US male)</option>
        <option value="bf_emma">Emma (UK female)</option>
        <option value="bm_george">George (UK male)</option>
      </select>
    </div>
    <div class="row">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" />
      <span id="speedVal">1.0×</span>
    </div>
    <div class="row">
      <button id="read" class="primary">▶ Read page</button>
    </div>
    <div class="row">
      <button id="pause">⏸ Pause</button>
      <button id="stop">⏹ Stop</button>
    </div>
    <div id="status">Loading…</div>
    <div id="bar"><div id="fill"></div></div>
    <script src="popup.js"></script>
  </body>
</html>
