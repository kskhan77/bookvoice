<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        width: 300px;
        margin: 0;
        padding: 14px;
        background: #1b1d22;
        color: #e8e8ea;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 10px;
      }
      label {
        font-size: 12px;
        color: #a5a8b0;
        min-width: 44px;
      }
      select,
      input[type="range"] {
        flex: 1;
      }
      select {
        background: #2a2d35;
        color: inherit;
        border: 1px solid #3a3e48;
        border-radius: 6px;
        padding: 5px 6px;
        font-size: 13px;
      }
      button {
        flex: 1;
        padding: 8px 6px;
        border: none;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        background: #2a2d35;
        color: #e8e8ea;
      }
      button.primary {
        background: #4f7cff;
        color: #fff;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #speedVal {
        font-size: 12px;
        color: #a5a8b0;
        min-width: 34px;
        text-align: right;
      }
      #status {
        font-size: 12px;
        color: #a5a8b0;
        margin-top: 10px;
        min-height: 30px;
        line-height: 1.4;
      }
      #bar {
        height: 4px;
        background: #2a2d35;
        border-radius: 2px;
        overflow: hidden;
        margin-top: 6px;
      }
      #fill {
        height: 100%;
        width: 0;
        background: #4f7cff;
        transition: width 0.3s;
      }
      #resume {
        background: #2f6d4f;
        color: #fff;
      }
      #bmSection h2 {
        font-size: 12px;
        color: #a5a8b0;
        margin: 14px 0 6px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .bm {
        display: flex;
        align-items: center;
        gap: 6px;
        background: #22252c;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 6px;
        cursor: pointer;
      }
      .bm:hover {
        background: #2a2d35;
      }
      .bmInfo {
        flex: 1;
        min-width: 0;
      }
      .bmTitle {
        font-size: 12.5px;
        color: #e8e8ea;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bmMeta {
        font-size: 11px;
        color: #a5a8b0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }
      .bmDel {
        flex: 0 0 auto;
        width: 22px;
        height: 22px;
        padding: 0;
        font-size: 11px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>📖 BookVoice</h1>
    <div class="row">
      <label for="voice">Voice</label>
      <select id="voice">
        <option value="af_heart">Heart (US female) — best</option>
        <option value="af_bella">Bella (US female)</option>
        <option value="af_nicole">Nicole (US female, soft)</option>
        <option value="am_michael">Michael (US male)</option>
        <option value="am_fenrir">Fenrir (US male)</option>
        <option value="bf_emma">Emma (UK female)</option>
        <option value="bm_george">George (UK male)</option>
      </select>
    </div>
    <div class="row">
      <label for="speed">Speed</label>
      <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1" />
      <span id="speedVal">1.0×</span>
    </div>
    <div class="row">
      <button id="read" class="primary">▶ Read page</button>
    </div>
    <div class="row" id="resumeRow" style="display: none">
      <button id="resume">⏯ Resume</button>
    </div>
    <div class="row" id="pdfRow" style="display: none">
      <button id="pdfBtn">📄 Open in BookVoice PDF Reader</button>
    </div>
    <div class="row">
      <button id="pause">⏸ Pause</button>
      <button id="stop">⏹ Stop</button>
    </div>
    <div class="row" id="bmRow" style="display: none">
      <button id="bookmark">🔖 Bookmark this spot</button>
    </div>
    <div id="status">Loading…</div>
    <div id="bar"><div id="fill"></div></div>
    <div id="bmSection" style="display: none">
      <h2>Bookmarks</h2>
      <div id="bmList"></div>
    </div>
    <details id="diagBox" style="margin-top: 12px">
      <summary style="font-size: 11px; color: #6d717c; cursor: pointer">
        Diagnostics
      </summary>
      <pre
        id="diag"
        style="
          font-size: 10px;
          line-height: 1.5;
          color: #a5a8b0;
          background: #22252c;
          border-radius: 6px;
          padding: 8px;
          max-height: 160px;
          overflow: auto;
          white-space: pre-wrap;
          user-select: text;
        "
      ></pre>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
